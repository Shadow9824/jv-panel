<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:#e8f1fb;-webkit-font-smoothing:antialiased;

  display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(0,180,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,180,255,.035) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 80%);mask-image:linear-gradient(180deg,#000,transparent 80%)}
.hidden{display:none!important}
.staticrypt-spinner-container{display:grid;place-items:center;height:100%}
.staticrypt-spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(0,180,255,.2);border-top-color:#00b4ff;animation:spin 1s linear infinite}
.card{position:relative;width:100%;max-width:380px;text-align:center}
.core{position:relative;width:132px;height:132px;margin:0 auto 18px}
.core svg{position:absolute;inset:0;width:100%;height:100%}
.core .o1{animation:spin 26s linear infinite}.core .o2{animation:spin 38s linear infinite reverse}
.core .eye{position:absolute;inset:34px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#0b2a52,#050c1c 70%);
  box-shadow:0 0 0 1px rgba(0,180,255,.45),0 0 28px rgba(0,160,255,.28);display:grid;place-items:center}
.core .eye i{width:18px;height:3.5px;border-radius:4px;background:#5fd2ff;box-shadow:0 0 10px #00b4ff;margin:0 3px;display:inline-block;animation:glow 4s ease-in-out infinite}
.core .pulse{position:absolute;inset:26px;border-radius:50%;border:1.5px solid rgba(0,180,255,.5);animation:pulse 3.6s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(.9);opacity:0}15%{opacity:.7}100%{transform:scale(1.4);opacity:0}}
@keyframes glow{50%{opacity:.55}}
h1{font-size:28px;font-weight:700;letter-spacing:.32em;margin-right:-.32em;background:linear-gradient(180deg,#e9f7ff,#7fd6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.subt{margin-top:6px;font-size:14px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#f5c04a}
.box{margin-top:26px;padding:22px 20px;border-radius:18px;text-align:left;
  background:linear-gradient(180deg,rgba(13,28,52,.8),rgba(7,15,30,.9));border:1px solid rgba(0,180,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 12px 34px rgba(0,0,0,.4),0 0 24px rgba(0,180,255,.07)}
.box p{font-size:15px;color:#a9bad0;line-height:1.45;margin-bottom:16px}
.pw{position:relative}

#staticrypt-password::placeholder{color:#7d8ea6}

.eyebtn svg{width:22px;height:22px}

.staticrypt-remember input{width:22px;height:22px;accent-color:#00b4ff;flex:none}
.staticrypt-decrypt-button{margin-top:10px;width:100%;height:54px;border:0;border-radius:14px;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.14em;

.staticrypt-decrypt-button:active{transform:translateY(1px)}
.err{margin-top:12px;font-size:14px;color:#ffb0b0;min-height:20px;text-align:center}
.foot{margin-top:18px;font-size:12px;color:#7d8ea6;display:flex;gap:6px;justify-content:center;align-items:center}
.foot svg{width:14px;height:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
